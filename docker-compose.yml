services:
  backend:
    build:
      context: ./backend
    container_name: crypto-ai-backend
    env_file:
      - .env
    ports:
      - "127.0.0.1:${API_PORT:-8100}:${API_PORT:-8100}"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=postgresql+psycopg://crypto:crypto_pass@postgres:5432/crypto_ai_agent
      - API_PORT=${API_PORT:-8100}
      - REDIS_URL=redis://redis:6379/0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT:-8100}/docs"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - default
      - nginx-network

  frontend:
    build:
      context: ./frontend
      args:
        DEBUG: ${DEBUG:-false}
    container_name: crypto-ai-frontend
    env_file:
      - .env
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3100}:${FRONTEND_PORT:-3100}"
    depends_on:
      - backend
    environment:
      - PORT=${FRONTEND_PORT:-3100}
      - NEXT_PUBLIC_DEBUG=${DEBUG:-false}
    healthcheck:
      test: ["CMD", "curl", "-f", "-L", "http://localhost:${FRONTEND_PORT:-3100}"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - default
      - nginx-network

  postgres:
    image: postgres:15
    container_name: crypto-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crypto_ai_agent}
      POSTGRES_USER: ${POSTGRES_USER:-crypto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crypto_pass}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: crypto-ai-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:

networks:
  nginx-network:
    external: true
