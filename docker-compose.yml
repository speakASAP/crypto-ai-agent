# ⚠️ WARNING: This file is for LOCAL DEVELOPMENT ONLY
# ⚠️ For production, use docker-compose.blue.yml and docker-compose.green.yml
# ⚠️ Production uses external database-server microservice (db-server-postgres, db-server-redis)
#
# To use external database in development:
# 1. Ensure database-server is running: cd ../database-server && ./scripts/start.sh
# 2. Set DATABASE_URL=postgresql+psycopg://user:pass@db-server-postgres:5432/crypto_ai_agent
# 3. Set REDIS_URL=redis://db-server-redis:6379/0
# 4. Set LOGGING_SERVICE_URL=http://logging-microservice:3268

services:
  backend:
    build:
      context: ./backend
    container_name: crypto-ai-backend
    env_file:
      - .env
    ports:
      - "127.0.0.1:${API_PORT:-8100}:${API_PORT:-8100}"
    # Note: For production, remove depends_on and use external database-server
    # depends_on:
    #   - postgres
    #   - redis
    volumes:
      - ./logs:/app/logs
    environment:
      # Use external database-server if available, otherwise fallback to local
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-crypto}:${POSTGRES_PASSWORD:-crypto_pass}@db-server-postgres:5432/${POSTGRES_DB:-crypto_ai_agent}}
      - API_PORT=${API_PORT:-8100}
      - REDIS_URL=${REDIS_URL:-redis://db-server-redis:6379/0}
      - LOGGING_SERVICE_URL=${LOGGING_SERVICE_URL:-http://logging-microservice:3268}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth-microservice:3370}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT:-8100}/docs"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - default
      - nginx-network

  frontend:
    build:
      context: ./frontend
      args:
        DEBUG: ${DEBUG:-false}
    container_name: crypto-ai-frontend
    env_file:
      - .env
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3100}:${FRONTEND_PORT:-3100}"
    depends_on:
      - backend
    environment:
      - PORT=${FRONTEND_PORT:-3100}
      - NEXT_PUBLIC_DEBUG=${DEBUG:-false}
    healthcheck:
      test: ["CMD", "curl", "-f", "-L", "http://localhost:${FRONTEND_PORT:-3100}"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - default
      - nginx-network

  # ⚠️ NOTE: These services are for LOCAL DEVELOPMENT ONLY
  # ⚠️ Production uses external database-server microservice
  # ⚠️ To use external database, comment out these services and ensure database-server is running
  postgres:
    image: postgres:15
    container_name: crypto-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crypto_ai_agent}
      POSTGRES_USER: ${POSTGRES_USER:-crypto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crypto_pass}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - default

  redis:
    image: redis:7
    container_name: crypto-ai-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - default

volumes:
  pgdata:
  redisdata:

networks:
  nginx-network:
    external: true
