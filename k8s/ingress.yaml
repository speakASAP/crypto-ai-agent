apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crypto-ai-agent
  namespace: statex-apps
  labels:
    app: crypto-ai-agent
    managed-by: k8s-migration
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - crypto-ai-agent.alfares.cz
      secretName: crypto-ai-agent-tls
  rules:
    - host: crypto-ai-agent.alfares.cz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crypto-ai-agent
                port:
                  number: 3000
