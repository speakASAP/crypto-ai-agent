apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crypto-ai-agent-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: crypto-ai-agent-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/prod/crypto-ai-agent
        property: DATABASE_URL
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: secret/prod/crypto-ai-agent
        property: GEMINI_API_KEY
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/prod/crypto-ai-agent
        property: JWT_SECRET
    - secretKey: NEWS_API_KEY
      remoteRef:
        key: secret/prod/crypto-ai-agent
        property: NEWS_API_KEY
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: secret/prod/crypto-ai-agent
        property: OPENROUTER_API_KEY
    - secretKey: PAYMENT_API_KEY
      remoteRef:
        key: secret/prod/crypto-ai-agent
        property: PAYMENT_API_KEY
    - secretKey: PAYMENT_APPLICATION_ID
      remoteRef:
        key: secret/prod/crypto-ai-agent
        property: PAYMENT_APPLICATION_ID
    - secretKey: PAYMENT_WEBHOOK_API_KEY
      remoteRef:
        key: secret/prod/crypto-ai-agent
        property: PAYMENT_WEBHOOK_API_KEY
    - secretKey: REDIS_URL
      remoteRef:
        key: secret/prod/crypto-ai-agent
        property: REDIS_URL
    - secretKey: SECRET_KEY
      remoteRef:
        key: secret/prod/crypto-ai-agent
        property: SECRET_KEY
