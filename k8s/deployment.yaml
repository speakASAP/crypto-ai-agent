apiVersion: apps/v1
kind: Deployment
metadata:
  name: crypto-ai-agent
  namespace: statex-apps
  labels:
    app: crypto-ai-agent
    managed-by: k8s-migration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crypto-ai-agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: crypto-ai-agent
    spec:
      containers:
        - name: app
          image: localhost:5000/crypto-ai-agent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: LOGGING_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: logging-ingest-credentials
                  key: LOGGING_SERVICE_TOKEN
          envFrom:
            - configMapRef:
                name: crypto-ai-agent-config
            - secretRef:
                name: crypto-ai-agent-secret
          startupProbe:
            tcpSocket:
              port: 3000
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
