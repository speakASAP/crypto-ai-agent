<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="logoOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7931a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff9500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffaa33;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Balanced icon symbol -->
  <g transform="translate(5, 5)">
    <circle cx="25" cy="25" r="22" fill="url(#logoOrangeGrad)"/>
    <circle cx="25" cy="25" r="22" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.15"/>
    
    <!-- Balanced B Letter - white shape centered -->
    <g transform="translate(25, 25)">
      <!-- Shadow for depth -->
      <path d="M -3 -15 L -3 15 L 4 15 L 4 9 Q 7 9 7 5.5 Q 7 2 4 2 L 4 -2 Q 7 -2 7 -5.5 Q 7 -9 4 -9 L 4 -15 Z" 
            fill="#000000" opacity="0.15"/>
      
      <!-- Main B shape - white shape centered -->
      <path d="M -3 -15 L -3 15 L 4 15 L 4 9 Q 7 9 7 5.5 Q 7 2 4 2 L 4 -2 Q 7 -2 7 -5.5 Q 7 -9 4 -9 L 4 -15 Z" 
            fill="#ffffff"/>
      
      <!-- Inner B curves - thicker -->
      <path d="M 4 -9 Q 7 -9 7 -5.5 Q 7 -2 4 -2" 
            fill="none" stroke="url(#logoOrangeGrad)" stroke-width="2.8" opacity="0.95"/>
      <path d="M 4 2 Q 7 2 7 5.5 Q 7 9 4 9" 
            fill="none" stroke="url(#logoOrangeGrad)" stroke-width="2.8" opacity="0.95"/>
      <line x1="7" y1="-9" x2="7" y2="9" stroke="url(#logoOrangeGrad)" stroke-width="2.8" opacity="0.95"/>
      
      <!-- Vertical line - thicker, centered -->
      <line x1="4" y1="-15" x2="4" y2="15" stroke="#ffffff" stroke-width="3.8"/>
    </g>
    
    <!-- Balanced AI nodes (reduced opacity to make B stand out) -->
    <circle cx="11" cy="11" r="1.5" fill="url(#logoBlueGrad)" opacity="0.7"/>
    <circle cx="39" cy="11" r="1.5" fill="url(#logoBlueGrad)" opacity="0.7"/>
    <circle cx="11" cy="39" r="1.5" fill="url(#logoBlueGrad)" opacity="0.7"/>
    <circle cx="39" cy="39" r="1.5" fill="url(#logoBlueGrad)" opacity="0.7"/>
    
    <!-- Balanced connections -->
    <line x1="11" y1="11" x2="28" y2="22" stroke="url(#logoBlueGrad)" stroke-width="1" opacity="0.4"/>
    <line x1="39" y1="11" x2="22" y2="22" stroke="url(#logoBlueGrad)" stroke-width="1" opacity="0.4"/>
    <line x1="11" y1="39" x2="28" y2="28" stroke="url(#logoBlueGrad)" stroke-width="1" opacity="0.4"/>
    <line x1="39" y1="39" x2="22" y2="28" stroke="url(#logoBlueGrad)" stroke-width="1" opacity="0.4"/>
  </g>
  
  <!-- Balanced text -->
  <text x="70" y="36" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#1f2937" letter-spacing="-0.5">Crypto AI Agent</text>
  <text x="70" y="48" font-family="Arial, sans-serif" font-size="9" fill="#64748b" letter-spacing="0.5">v2.0</text>
</svg>
