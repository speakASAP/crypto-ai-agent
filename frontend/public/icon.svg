<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7931a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff9500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffaa33;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle - solid orange -->
  <circle cx="32" cy="32" r="30" fill="#f7931a"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
  
  <!-- Balanced B Letter - white shape centered -->
  <g transform="translate(32, 32)">
    <!-- Shadow/outline for better visibility -->
    <path d="M -5 -20 L -5 20 L 2 20 L 2 11 Q 5 11 5 7 Q 5 3 2 3 L 2 -3 Q 5 -3 5 -7 Q 5 -11 2 -11 L 2 -20 Z" 
          fill="#000000" opacity="0.2"/>
    
    <!-- Main B shape - white shape centered -->
    <path d="M -5 -20 L -5 20 L 2 20 L 2 11 Q 5 11 5 7 Q 5 3 2 3 L 2 -3 Q 5 -3 5 -7 Q 5 -11 2 -11 L 2 -20 Z" 
          fill="#ffffff"/>
    
    <!-- Inner B curves - thicker and more visible -->
    <path d="M 2 -11 Q 5 -11 5 -7 Q 5 -3 2 -3" 
          fill="none" stroke="url(#orangeGrad)" stroke-width="3.5" opacity="0.95"/>
    <path d="M 2 3 Q 5 3 5 7 Q 5 11 2 11" 
          fill="none" stroke="url(#orangeGrad)" stroke-width="3.5" opacity="0.95"/>
    <line x1="5" y1="-11" x2="5" y2="11" stroke="url(#orangeGrad)" stroke-width="3.5" opacity="0.95"/>
    
    <!-- Vertical line - thicker, centered -->
    <line x1="2" y1="-20" x2="2" y2="20" stroke="#ffffff" stroke-width="4.5"/>
  </g>
  
  <!-- AI Elements - balanced around B (slightly reduced opacity to make B stand out more) -->
  <!-- Top nodes -->
  <circle cx="22" cy="14" r="2" fill="url(#blueGrad)" opacity="0.7"/>
  <circle cx="42" cy="14" r="2" fill="url(#blueGrad)" opacity="0.7"/>
  
  <!-- Side nodes -->
  <circle cx="14" cy="32" r="2" fill="url(#blueGrad)" opacity="0.7"/>
  <circle cx="50" cy="32" r="2" fill="url(#blueGrad)" opacity="0.7"/>
  
  <!-- Bottom nodes -->
  <circle cx="22" cy="50" r="2" fill="url(#blueGrad)" opacity="0.7"/>
  <circle cx="42" cy="50" r="2" fill="url(#blueGrad)" opacity="0.7"/>
  
  <!-- Balanced connection lines forming hexagon -->
  <line x1="22" y1="14" x2="35" y2="26" stroke="url(#blueGrad)" stroke-width="1.2" opacity="0.4"/>
  <line x1="42" y1="14" x2="29" y2="26" stroke="url(#blueGrad)" stroke-width="1.2" opacity="0.4"/>
  <line x1="14" y1="32" x2="35" y2="28" stroke="url(#blueGrad)" stroke-width="1.2" opacity="0.4"/>
  <line x1="50" y1="32" x2="29" y2="28" stroke="url(#blueGrad)" stroke-width="1.2" opacity="0.4"/>
  <line x1="22" y1="50" x2="35" y2="38" stroke="url(#blueGrad)" stroke-width="1.2" opacity="0.4"/>
  <line x1="42" y1="50" x2="29" y2="38" stroke="url(#blueGrad)" stroke-width="1.2" opacity="0.4"/>
  
  <!-- Interconnections for balance -->
  <line x1="22" y1="14" x2="14" y2="32" stroke="url(#blueGrad)" stroke-width="0.8" opacity="0.25"/>
  <line x1="42" y1="14" x2="50" y2="32" stroke="url(#blueGrad)" stroke-width="0.8" opacity="0.25"/>
  <line x1="22" y1="50" x2="14" y2="32" stroke="url(#blueGrad)" stroke-width="0.8" opacity="0.25"/>
  <line x1="42" y1="50" x2="50" y2="32" stroke="url(#blueGrad)" stroke-width="0.8" opacity="0.25"/>
</svg>
